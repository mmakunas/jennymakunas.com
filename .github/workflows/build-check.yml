# The free gate on pull requests (Michael 2026-11-01 card: "Add CI + protect main … Same for the Jenny site").
# `pages.yml` deploys on pushes to main only, so a PR had no check at all; this builds the site the same way
# (npm ci, astro build + lint-paths) without deploying. Branch protection requires the `build` check.
name: build
on:
  pull_request:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE: ${{ vars.PAGES_BASE || '/' }}
          SITE: ${{ vars.PAGES_SITE || 'https://www.jennymakunas.com' }}
      # The run record `.gstack/pregate.json` accepts as the build gate at this
      # tree, so pregate and /ship reuse this green run instead of building again.
      # It names the pull request's own commit tree, which is what a lane builds
      # and tests locally, not the merge commit GitHub builds here. `files` and
      # `tests` describe the one check the build gates on, `lint:paths`.
      - name: Record the tested tree
        run: |
          set -euo pipefail
          # refs/pull/<n>/head is the pull request's own commit, in this repository
          # even for a fork, so the record can name its tree.
          git fetch --depth 1 origin "refs/pull/${{ github.event.number }}/head"
          head_sha=$(git rev-parse FETCH_HEAD)
          jq -n --argjson run "${{ github.run_id }}" --argjson attempt "${{ github.run_attempt }}" \
            --arg event "${{ github.event_name }}" --arg sha "${{ github.sha }}" \
            --arg head_sha "$head_sha" --arg tree "$(git rev-parse FETCH_HEAD^{tree})" \
            --arg os "${{ runner.os }}" --argjson files '["scripts/site/lint-paths.mjs"]' \
            '{run_id: $run, run_attempt: $attempt, event: $event, sha: $sha, head_sha: $head_sha,
              tree: $tree, os: $os, files: $files, tests: 1}' > "$RUNNER_TEMP/tree.json"
          cat "$RUNNER_TEMP/tree.json"
      - name: Upload the tested tree
        uses: actions/upload-artifact@v4
        with:
          name: build-tree
          path: ${{ runner.temp }}/tree.json
          retention-days: 7

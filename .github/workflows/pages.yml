name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Two repository variables describe where the site is published, and both
      # change together at the DNS step: PAGES_BASE is the path Pages serves it
      # from ('/jennymakunas.com/' while this repo is a project site under
      # www.makunas.com, '/' on the custom domain), and PAGES_SITE is the origin
      # the pages are canonical at ('https://www.makunas.com' today,
      # 'https://www.jennymakunas.com' on the custom domain). Set both.
      - name: Build
        run: npm run build
        env:
          BASE: ${{ vars.PAGES_BASE || '/jennymakunas.com/' }}
          SITE: ${{ vars.PAGES_SITE || 'https://www.makunas.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
